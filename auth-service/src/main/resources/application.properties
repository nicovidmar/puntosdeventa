spring.application.name=auth-service
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/accreditation
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.sql.init.mode=always


jwt.secret.key = 123456789123456789123456789123456789123456a

# Dirección del servidor Eureka (en este caso, Eureka Server corre en localhost:8761)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Habilitar registro en Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Evita errores por hostname si estás trabajando localmente
eureka.instance.prefer-ip-address=true

management.tracing.sampling.probability=1.0
spring.application.name=pos-service
server.port=8081

spring.data.redis.host=localhost
spring.data.redis.port=6379



# Dirección del servidor Eureka (en este caso, Eureka Server corre en localhost:8761)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Habilitar registro en Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Evita errores por hostname si estás trabajando localmente
eureka.instance.prefer-ip-address=true

management.tracing.sampling.probability=1.0